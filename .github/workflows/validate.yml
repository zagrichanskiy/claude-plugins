name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # The gate. An agent with malformed frontmatter loads as nothing at all, with no error
    # anywhere, so a broken commit here removes the agent on every machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lint-plugin.py

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The reminder hook prints valid hook JSON
        run: |
          echo '{}' | plugins/cure/hooks/flat-reminder.sh \
            | jq -e '.hookSpecificOutput.additionalContext | length > 0'
      - name: The artifact hook prints valid deny JSON
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"git commit -m \"Fix PR #15\""}}' \
            | plugins/cure/hooks/flat-artifact-check.sh \
            | jq -e '.hookSpecificOutput.permissionDecision == "deny"'
      - name: The reply-limit sentence matches across style, hook and README
        run: |
          for f in plugins/cure/output-styles/flat.md plugins/cure/hooks/flat-reminder.sh README.md; do
            perl -0777 -ne 's/\s+/ /g; print "$1\n" if /(A reply is [^.]*\.)/' "$f"
          done | tee /tmp/limits
          [ "$(wc -l < /tmp/limits)" -eq 3 ] && [ "$(sort -u /tmp/limits | wc -l)" -eq 1 ]

  plugin-validate:
    # The CLI's own manifest check. It runs behind a network installer, so a failure here is
    # advisory; the lint job above is what blocks.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Validate the marketplace manifest
        run: ~/.local/bin/claude plugin validate .
